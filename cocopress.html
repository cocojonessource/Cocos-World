<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CocoPress</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3e6ff;
}

/* ===== HERO SHELF ===== */
.hero{
  padding:40px;
}

.shelf{
  height:6px;
  background:#b695db;
  margin-top:20px;
  width:80%;
  margin-left:auto;
  margin-right:auto;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.books{
  display:flex;
  justify-content:center;
  gap:40px;
}

/* ===== BOOK ===== */
.book{
  width:180px;
  height:280px;
  position:relative;
  border-radius:6px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 20px 30px rgba(0,0,0,0.2);
}

/* CREASE */
.book::before{
  content:"";
  position:absolute;
  left:0;
  width:10px;
  height:100%;
  background:linear-gradient(to right, rgba(0,0,0,0.3), transparent);
}

/* IMAGE */
.book img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TITLE */
.book-title{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  color:white;
  font-weight:bold;
  font-size:14px;
  text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

/* ===== GALLERY ===== */
.gallery{
  padding:40px;
}

.grid{
  display:flex;
  gap:20px;
  overflow:hidden;
}

.arrow{
  cursor:pointer;
  font-size:30px;
  user-select:none;
}

/* ===== SEARCH ===== */
.search{
  text-align:center;
  margin-bottom:20px;
}

input{
  padding:10px;
  width:300px;
}

/* ===== READER ===== */
.reader{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.reader-box{
  background:white;
  width:500px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  top:10px;
  left:10px;
  cursor:pointer;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  left:0;
  top:100px;
  width:150px;
  background:white;
  padding:10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h4>History</h4>
  <div id="history"></div>
  <h4>Bookmarks</h4>
  <div id="bookmarks"></div>
</div>

<div class="hero">
  <div class="books" id="heroBooks"></div>
  <div class="shelf"></div>
</div>

<div class="gallery">
  <div class="search">
    <input id="searchInput" placeholder="Search CocoPress...">
  </div>

  <div style="display:flex; align-items:center;">
    <div class="arrow" onclick="prev()">‹</div>
    <div class="grid" id="grid"></div>
    <div class="arrow" onclick="next()">›</div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-box">
    <div class="close" onclick="closeReader()">X</div>
    <h2 id="rTitle"></h2>
    <p id="rSummary"></p>
    <button id="bookmarkBtn">Bookmark</button>
    <button id="readBtn">Read on Source</button>
  </div>
</div>

<script>
let galleryData = [];
let searchData = [];
let index = 0;
let pageSize = 10;

/* ===== BLOCKED SEARCH ===== */
const blocked = ["nude","sex","dick","pussy","leaks"];

function checkSearch(q){
  return blocked.some(word => q.includes(word));
}

/* ===== LOAD DATA ===== */
fetch("gallery.json").then(r=>r.json()).then(d=>{
  galleryData = d;
  render();
});

fetch("search.json").then(r=>r.json()).then(d=>{
  searchData = d;
});

/* ===== RENDER ===== */
function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML="";

  const slice = galleryData.slice(index,index+pageSize);

  slice.forEach(a=>{
    grid.innerHTML += `
      <div class="book" onclick="openReader('${a.id}')">
        <img src="${a.image}">
        <div class="book-title">${a.title}</div>
      </div>
    `;
  });
}

/* ===== SLIDE ===== */
function next(){
  if(index + pageSize < galleryData.length){
    index += pageSize;
    render();
  }
}

function prev(){
  if(index - pageSize >= 0){
    index -= pageSize;
    render();
  }
}

/* ===== SEARCH ===== */
document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();

  if(checkSearch(q)){
    alert("This search is inappropriate. Stop.");
    e.target.value="";
    return;
  }

  const results = searchData.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.summary.toLowerCase().includes(q)
  );

  galleryData = results;
  index = 0;
  render();
});

/* ===== READER ===== */
function openReader(id){
  const a = galleryData.find(x=>x.id===id);
  document.getElementById("reader").style.display="flex";
  document.getElementById("rTitle").innerText=a.title;
  document.getElementById("rSummary").innerText=a.summary;

  document.getElementById("readBtn").onclick=()=>{
    window.open(a.url,"popup","width=600,height=600");
    addHistory(a);
  };

  document.getElementById("bookmarkBtn").onclick=()=>{
    addBookmark(a);
  };
}

function closeReader(){
  document.getElementById("reader").style.display="none";
}

/* ===== STORAGE ===== */
function addHistory(a){
  let h = JSON.parse(localStorage.getItem("history")||"[]");
  h.unshift(a);
  localStorage.setItem("history",JSON.stringify(h));
}

function addBookmark(a){
  let b = JSON.parse(localStorage.getItem("bookmarks")||"[]");
  b.unshift(a);
  localStorage.setItem("bookmarks",JSON.stringify(b));
}
</script>

</body>
</html>
