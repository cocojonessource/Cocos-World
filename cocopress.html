<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CocoPress — Coco's World</title>

  <style>
    /* =========================================================
       1) COLOR SYSTEM
       ---------------------------------------------------------
       Main page colors.
       ========================================================= */
    :root {
      --bg-1: #f8f0ff;
      --bg-2: #eddfff;
      --bg-3: #dcc4f3;

      --lavender: #8b5fbf;
      --lavender-deep: #6b2fa3;
      --lavender-soft: #b695db;

      --pink: #f2bfd7;
      --pink-soft: #ffe4f0;
      --pink-marker: #e88abf;

      --white: #ffffff;
      --gold: #d9b165;

      --text: #562b83;
      --text-soft: #7d5aa6;

      --panel: rgba(255, 255, 255, 0.58);
      --border: rgba(255, 255, 255, 0.64);

      --shelf-top: #efdfff;
      --shelf-mid: #d7b7f0;
      --shelf-bottom: #b984db;

      --sidebar-width: 214px;

      /* Wider / thicker books */
      --featured-book-width: 254px;
      --featured-book-height: 404px;

      --archive-book-width: 100%;
      --archive-book-height: 372px;

      --reader-book-width: 214px;
      --reader-book-height: 340px;

      --book-radius: 9px;
      --reader-width: 1180px;
    }

    /* =========================================================
       2) GLOBAL RESETS
       ---------------------------------------------------------
       Keeps layout predictable.
       ========================================================= */
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,0.75), transparent 20%),
        radial-gradient(circle at 85% 18%, rgba(255,255,255,0.42), transparent 22%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.25), transparent 24%),
        linear-gradient(to bottom, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font: inherit;
    }

    /* =========================================================
       3) TOP NAVIGATION
       ---------------------------------------------------------
       Main site nav.
       ========================================================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 2500;
      background: rgba(245, 234, 255, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.6);
    }

    .topbar-inner {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--lavender-deep);
    }

    .anchor-home {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.92);
      color: var(--gold);
      border: 1px solid rgba(255,255,255,0.8);
      flex-shrink: 0;
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 15px;
      font-weight: 700;
      color: var(--lavender-deep);
    }

    .nav a {
      position: relative;
      opacity: 0.92;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, var(--pink), var(--lavender));
      transform: scaleX(0);
      transform-origin: center;
      transition: transform 0.22s ease;
    }

    .nav a:hover::after,
    .nav a.active::after {
      transform: scaleX(1);
    }

    /* =========================================================
       4) PAGE LAYOUT
       ---------------------------------------------------------
       Sidebar + main content.
       ========================================================= */
    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding: 28px 20px 70px;
    }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .main {
      min-width: 0;
    }

    /* =========================================================
       5) SIDEBAR
       ---------------------------------------------------------
       Base comes from your preferred sidebar layout.
       Icons added to links.
       ========================================================= */
    .sidebar {
      position: sticky;
      top: 92px;
      min-height: calc(100vh - 116px);
      padding: 22px 16px;
      border-radius: 24px;
      background: rgba(255,255,255,0.52);
      border: 1px solid rgba(255,255,255,0.65);
      backdrop-filter: blur(12px);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--lavender-deep);
    }

    .sidebar-header svg,
    .sidebar-link svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.05;
      font-weight: 700;
    }

    .sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 12px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      color: var(--lavender-deep);
      transition: background 0.2s ease;
    }

    .sidebar-link:hover {
      background: rgba(255,255,255,0.50);
    }

    .sidebar-link.active {
      background: rgba(255,255,255,0.85);
    }

    /* =========================================================
       6) PAGE HEADER
       ---------------------------------------------------------
       Plain title + copy.
       ========================================================= */
    .page-header {
      margin-bottom: 18px;
      padding-top: 4px;
    }

    .hero-title {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 6vw, 82px);
      line-height: 0.94;
      color: var(--lavender-deep);
    }

    .hero-copy {
      margin: 0;
      font-size: 17px;
      line-height: 1.8;
      color: var(--text-soft);
      max-width: 780px;
    }

    /* =========================================================
       7) GENERIC PANEL
       ---------------------------------------------------------
       Shared card shell.
       ========================================================= */
    .panel {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 30px;
      backdrop-filter: blur(14px);
    }

    /* =========================================================
       8) FEATURED SECTION
       ---------------------------------------------------------
       Four featured books.
       No shadows.
       ========================================================= */
    .featured-wrap {
      position: relative;
      padding: 26px 28px 30px;
      margin-bottom: 22px;
      overflow: hidden;
    }

    .sparkle-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 30px;
    }

    .sparkle {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.95);
      animation: twinkle 3.2s ease-in-out infinite;
    }

    .sparkle.s1 { width: 3px; height: 3px; }
    .sparkle.s2 { width: 4px; height: 4px; animation-duration: 2.8s; }
    .sparkle.s3 { width: 5px; height: 5px; animation-duration: 3.6s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .scribble-wrap {
      position: relative;
      z-index: 3;
      display: inline-block;
      margin: 0 0 28px 8px;
      padding-bottom: 18px;
    }

    .scribble-note {
      display: inline-block;
      font-family: "Comic Sans MS", "Marker Felt", "Trebuchet MS", sans-serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      color: var(--pink-marker);
      transform: rotate(-2deg);
    }

    .scribble-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 10px;
      border-bottom: 4px solid rgba(232, 138, 191, 0.92);
      border-radius: 999px;
    }

    .scribble-line.line-one {
      bottom: 6px;
      transform: rotate(-1deg);
    }

    .scribble-line.line-two {
      bottom: -2px;
      left: 22px;
      right: 22px;
      border-bottom-width: 3px;
      transform: rotate(1deg);
    }

    .featured-stage {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .hero-books {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 34px;
      min-height: 430px;
      padding: 0 8px 30px;
    }

    .featured-book-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 260px;
      min-height: 430px;
      flex: 0 0 auto;
    }

    .featured-shelf {
      position: relative;
      width: calc(100% - 18px);
      height: 14px;
      margin: 0 auto;
      border-radius: 999px;
      background: linear-gradient(to bottom, var(--shelf-top), var(--shelf-mid) 58%, var(--shelf-bottom));
      border: 1px solid rgba(255,255,255,0.52);
    }

    /* =========================================================
       9) BOOK DESIGN
       ---------------------------------------------------------
       Cover image + bottom title + author only.
       No outlet/editorial on covers.
       No stamps.
       No shadows.
       ========================================================= */
    .book {
      position: relative;
      border-radius: var(--book-radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.52);
      background: linear-gradient(145deg, #cfb7ee 0%, #a580d2 50%, #7043a6 100%);
      flex-shrink: 0;
      z-index: 1;
      transition: transform 0.2s ease;
    }

    .book:hover {
      transform: translateY(-3px);
    }

    .featured-book {
      width: var(--featured-book-width);
      height: var(--featured-book-height);
    }

    .archive-book {
      width: var(--archive-book-width);
      height: var(--archive-book-height);
    }

    .reader-book {
      width: var(--reader-book-width);
      height: var(--reader-book-height);
      margin-bottom: 10px;
    }

    .book-cover {
      position: absolute;
      inset: 0;
      padding: 16px 16px 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
    }

    .book-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(25, 10, 44, 0.04), rgba(25, 10, 44, 0.62));
      z-index: 0;
    }

    .book-cover > * {
      position: relative;
      z-index: 1;
    }

    .cover-bottom {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: auto;
    }

    .cover-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.02;
      color: rgba(255,255,255,0.98);
      font-weight: 700;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .featured-book .cover-title {
      font-size: 22px;
    }

    .archive-book .cover-title {
      font-size: 18px;
    }

    .reader-book .cover-title {
      font-size: 20px;
    }

    .cover-author {
      margin: 0;
      font-size: 12px;
      line-height: 1.3;
      color: rgba(255,255,255,0.94);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .cover-fallback-1 { background: linear-gradient(145deg, #e9d9f7 0%, #c7a1df 48%, #8a60ab 100%); }
    .cover-fallback-2 { background: linear-gradient(145deg, #b8b0f3 0%, #8a7ce1 45%, #5d4fc2 100%); }
    .cover-fallback-3 { background: linear-gradient(145deg, #ffdfd9 0%, #e9b2ca 44%, #ac6a9d 100%); }
    .cover-fallback-4 { background: linear-gradient(145deg, #9e77d8 0%, #6e40ad 42%, #4e247e 100%); }
    .cover-fallback-5 { background: linear-gradient(145deg, #f2d7ee 0%, #dbb5e8 44%, #a573cd 100%); }
    .cover-fallback-6 { background: linear-gradient(145deg, #f3c6dd 0%, #d48ab7 45%, #8a4f8f 100%); }
    .cover-fallback-7 { background: linear-gradient(145deg, #c8cff8 0%, #9aa9ec 42%, #6a6fbc 100%); }
    .cover-fallback-8 { background: linear-gradient(145deg, #d4b4f4 0%, #a576d2 44%, #67358f 100%); }

    /* =========================================================
       10) SEARCH + YEAR FILTER
       ---------------------------------------------------------
       Search stays.
       Year filter only.
       ========================================================= */
    .controls-wrap {
      padding: 18px;
      margin-bottom: 18px;
    }

    .control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 12px;
      align-items: center;
    }

    .search-input,
    .year-filter {
      width: 100%;
      border: 1px solid rgba(107,47,163,0.12);
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--lavender-deep);
      outline: none;
    }

    /* =========================================================
       11) LIBRARY GRID
       ---------------------------------------------------------
       24 per page, 4 per row, 6 rows.
       Clip pages so next/prev books do not show.
       No shadows.
       ========================================================= */
    .archive-section {
      padding: 22px;
      overflow: hidden;
    }

    .library-topbar,
    .library-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .library-topbar {
      margin-bottom: 18px;
    }

    .library-footer {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(107,47,163,0.08);
    }

    .page-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
    }

    .pagination-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pager-btn {
      border: none;
      background: rgba(255,255,255,0.94);
      color: var(--lavender-deep);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .pager-btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .archive-stage {
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .archive-track {
      display: flex;
      width: 100%;
      transition: transform 0.42s ease;
      will-change: transform;
    }

    .archive-page {
      min-width: 100%;
      max-width: 100%;
      flex: 0 0 100%;
      overflow: hidden;
    }

    .archive-grid-row {
      margin-bottom: 12px;
    }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px 20px;
    }

    .archive-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      overflow: hidden;
    }

    .row-shelf {
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(to bottom, var(--shelf-top), var(--shelf-mid) 58%, var(--shelf-bottom));
      border: 1px solid rgba(255,255,255,0.52);
      margin-top: 12px;
    }

    .archive-meta {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 12px 2px 0;
    }

    .archive-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      line-height: 1.02;
      color: var(--lavender-deep);
    }

    .archive-line {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-soft);
    }

    .empty-state {
      display: none;
      padding: 26px 10px 6px;
      text-align: center;
      color: var(--text-soft);
      font-size: 15px;
    }

    .footer {
      padding: 26px 20px 18px;
      text-align: center;
      color: var(--text-soft);
      font-size: 14px;
    }

    /* =========================================================
       12) READER MODAL
       ---------------------------------------------------------
       Base is your preferred reader design.
       Removed CocoPress text on left.
       Kept compact rounded rectangle feel.
       ========================================================= */
    .reader {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(44, 20, 67, 0.56);
      backdrop-filter: blur(12px);
    }

    .reader.active {
      display: flex;
    }

    .reader-shell {
      position: relative;
      width: min(var(--reader-width), 100%);
      height: min(92vh, 920px);
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      background: rgba(249, 244, 255, 0.97);
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.76);
    }

    .reader-close {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: none;
      background: rgba(255,255,255,0.96);
      color: var(--lavender-deep);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      z-index: 6;
    }

    .reader-left {
      position: relative;
      padding: 76px 24px 24px;
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,0.72), transparent 24%),
        radial-gradient(circle at 84% 20%, rgba(255,255,255,0.34), transparent 22%),
        linear-gradient(160deg, #f4e8ff 0%, #ecd9ff 52%, #e0c6f4 100%);
      border-right: 1px solid rgba(255,255,255,0.7);
      overflow-y: auto;
    }

    .reader-left::before,
    .reader-left::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      pointer-events: none;
    }

    .reader-left::before {
      top: 106px;
      right: 42px;
    }

    .reader-left::after {
      bottom: 88px;
      left: 42px;
      width: 7px;
      height: 7px;
    }

    .reader-book-display {
      position: relative;
      min-height: 430px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 16px;
    }

    .reader-book-glow {
      position: absolute;
      top: 56px;
      width: 220px;
      height: 300px;
      border-radius: 30px;
      background: rgba(130, 86, 190, 0.16);
      pointer-events: none;
      z-index: 0;
    }

    .reader-book-shelf {
      width: 210px;
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(to bottom, var(--shelf-top), var(--shelf-mid) 58%, var(--shelf-bottom));
      border: 1px solid rgba(255,255,255,0.52);
      margin-top: 18px;
      position: relative;
      z-index: 1;
    }

    .reader-right {
      padding: 78px 42px 34px;
      overflow-y: auto;
      background: rgba(255,255,255,0.84);
    }

    .reader-kicker {
      margin: 0 0 12px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .reader-title {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      line-height: 0.96;
      color: var(--lavender-deep);
      max-width: 820px;
    }

    .reader-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .reader-chip {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.03em;
      background: rgba(241,229,255,0.92);
      color: var(--lavender-deep);
      border: 1px solid rgba(167,129,209,0.18);
    }

    .reader-summary {
      margin: 0;
      font-size: 17px;
      line-height: 1.95;
      color: var(--text-soft);
      white-space: pre-line;
      max-width: 820px;
    }

    .reader-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(107,47,163,0.08);
    }

    .reader-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      border: none;
      background: linear-gradient(135deg, #f2bfd7, #c7a7ef);
      color: #4d246f;
      cursor: pointer;
    }

    .bookmark-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .bookmark-icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--lavender-deep);
      stroke-width: 1.6;
      transition: fill 0.2s ease, stroke 0.2s ease, transform 0.15s ease;
    }

    .bookmark-btn.active .bookmark-icon {
      fill: var(--lavender-deep);
      stroke: var(--lavender-deep);
    }

    .bookmark-btn:hover .bookmark-icon {
      transform: scale(1.05);
    }

    /* =========================================================
       13) BLOCKED SEARCH POPUP
       ---------------------------------------------------------
       Strict blocked term popup only.
       ========================================================= */
    .blocked-modal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(40, 18, 63, 0.48);
      backdrop-filter: blur(8px);
    }

    .blocked-modal.active {
      display: flex;
    }

    .blocked-modal-card {
      width: min(420px, 100%);
      background: rgba(255,255,255,0.96);
