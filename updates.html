<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Updates — Coco's World</title>

  <style>
    :root {
      --pink-1: #fff2fb;
      --pink-2: #ffd4ed;
      --pink-3: #f7a8d9;
      --lav-1: #f3e7ff;
      --lav-2: #d8b9ff;
      --lav-3: #b98af4;

      --deep: #5b247f;
      --soft: #8b5fb2;
      --hot-pink: #f08ac6;
      --white: #ffffff;

      --shadow: rgba(91, 36, 127, 0.16);
      --shadow-strong: rgba(91, 36, 127, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--deep);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 156, 215, 0.72), transparent 22%),
        radial-gradient(circle at 84% 26%, rgba(207, 164, 255, 0.62), transparent 25%),
        radial-gradient(circle at 48% 70%, rgba(255, 190, 230, 0.48), transparent 26%),
        radial-gradient(circle at 12% 86%, rgba(193, 141, 255, 0.42), transparent 24%),
        linear-gradient(135deg, #fff7fc 0%, #ffe3f3 32%, #f4e4ff 65%, #fff1f9 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background:
        radial-gradient(circle at 18% 30%, rgba(255, 122, 199, 0.34), transparent 18%),
        radial-gradient(circle at 78% 78%, rgba(255, 132, 202, 0.34), transparent 20%),
        radial-gradient(circle at 64% 22%, rgba(172, 117, 255, 0.22), transparent 18%);
      filter: blur(42px);
      opacity: 1;
    }

    body::after {
      background:
        linear-gradient(90deg, rgba(255,255,255,0.38), transparent 18%, transparent 82%, rgba(255,255,255,0.34)),
        linear-gradient(to bottom, rgba(255,255,255,0.38), transparent 22%, transparent 78%, rgba(255,225,245,0.36));
      opacity: 0.78;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .dream-orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(28px);
      opacity: 0.65;
      pointer-events: none;
      z-index: -1;
    }

    .orb-1 {
      width: 240px;
      height: 240px;
      left: 4%;
      top: 18%;
      background: rgba(255, 130, 204, 0.74);
    }

    .orb-2 {
      width: 300px;
      height: 300px;
      right: 8%;
      bottom: 10%;
      background: rgba(197, 145, 255, 0.64);
    }

    .orb-3 {
      width: 190px;
      height: 190px;
      left: 30%;
      bottom: 14%;
      background: rgba(255, 186, 231, 0.78);
    }

    .floating-heart {
      position: fixed;
      color: rgba(244, 116, 190, 0.28);
      font-size: 90px;
      filter: blur(7px);
      pointer-events: none;
      z-index: -1;
      transform: rotate(-10deg);
    }

    .heart-1 {
      left: 12%;
      top: 56%;
    }

    .heart-2 {
      right: 12%;
      top: 62%;
      color: rgba(178, 123, 244, 0.26);
      transform: rotate(12deg);
    }

    .heart-3 {
      right: 26%;
      top: 18%;
      font-size: 64px;
      color: rgba(255, 137, 204, 0.24);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 232, 246, 0.72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.7);
    }

    .topbar-inner {
      max-width: 1350px;
      margin: 0 auto;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--deep);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 14px;
      font-weight: 800;
      color: var(--deep);
    }

    .nav a.active {
      color: var(--hot-pink);
      border-bottom: 2px solid var(--hot-pink);
      padding-bottom: 4px;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .updates-frame {
      position: relative;
      min-height: 740px;
      padding: 34px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,239,249,0.58)),
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.85), transparent 24%);
      border: 1px solid rgba(255,255,255,0.86);
      box-shadow:
        0 30px 90px rgba(91, 36, 127, 0.16),
        inset 0 0 60px rgba(255,255,255,0.54);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .updates-frame::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(241, 143, 207, 0.28);
      pointer-events: none;
    }

    .hero-row {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 32px;
      position: relative;
      z-index: 2;
    }

    .scrapbook-area {
      position: relative;
      min-height: 660px;
      padding: 22px;
    }

    .page-title {
      margin: 0 0 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 76px;
      line-height: 0.9;
      color: var(--deep);
    }

    .page-subtitle {
      margin: 0 0 28px;
      font-size: 16px;
      color: var(--soft);
    }

    .scrapbook-stage {
      position: relative;
      height: 510px;
    }

    .scrap {
      position: absolute;
      background: rgba(255,255,255,0.86);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 20px 34px var(--shadow);
      backdrop-filter: blur(10px);
      cursor: pointer;
    }

    .main-polaroid {
      width: 300px;
      padding: 14px 14px 58px;
      left: 0;
      top: 20px;
      transform: rotate(-4deg);
    }

    .photo-placeholder {
      height: 300px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.52), transparent 20%),
        linear-gradient(135deg, #c591f4, #f0a8d5);
      border-radius: 4px;
      overflow: hidden;
    }

    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .polaroid-caption {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      font-family: "Comic Sans MS", "Trebuchet MS", cursive;
      font-size: 20px;
      line-height: 1.15;
      color: var(--deep);
      text-align: center;
    }

    .paper-note {
      width: 275px;
      padding: 24px;
      left: 330px;
      top: 70px;
      transform: rotate(2deg);
      border-radius: 8px;
    }

    .small-video {
      width: 260px;
      left: 250px;
      top: 300px;
      padding: 12px 12px 18px;
      background: rgba(225, 197, 255, 0.76);
      transform: rotate(1deg);
      border-radius: 10px;
    }

    .pink-note {
      width: 245px;
      left: 20px;
      bottom: 0;
      padding: 26px 24px;
      background: rgba(255, 192, 223, 0.78);
      transform: rotate(-3deg);
      border-radius: 8px;
    }

    .note-kicker {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--hot-pink);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .note-title {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.02;
    }

    .note-copy {
      margin: 12px 0 0;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.55;
    }

    .tape {
      position: absolute;
      width: 96px;
      height: 28px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.72);
      top: -13px;
      left: 38%;
      transform: rotate(-7deg);
      backdrop-filter: blur(2px);
    }

    .quick-panel {
      min-height: 660px;
      padding: 26px;
      border-radius: 34px;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 28px 70px var(--shadow);
      backdrop-filter: blur(20px);
    }

    .quick-panel h2 {
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      color: var(--deep);
    }

    .quick-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quick-item {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 16px;
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 14px;
      align-items: center;
      text-align: left;
      background: rgba(255, 244, 251, 0.78);
      color: var(--deep);
      cursor: pointer;
    }

    .quick-date {
      border-radius: 14px;
      padding: 10px 6px;
      background: rgba(235, 207, 255, 0.72);
      text-align: center;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 800;
    }

    .quick-title {
      display: block;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.2;
    }

    .quick-summary {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: var(--soft);
      line-height: 1.35;
    }

    .reader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(58, 23, 83, 0.42);
      backdrop-filter: blur(16px);
    }

    .reader.active {
      display: flex;
    }

    .reader-card {
      width: min(680px, 100%);
      border-radius: 34px;
      background: rgba(255, 248, 253, 0.96);
      box-shadow: 0 30px 90px var(--shadow-strong);
      border: 1px solid rgba(255,255,255,0.9);
      padding: 34px;
      position: relative;
    }

    .reader-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 999px;
      background: rgba(235,207,255,0.8);
      color: var(--deep);
      font-size: 24px;
      cursor: pointer;
    }

    .reader-type {
      margin: 0 0 10px;
      color: var(--hot-pink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .reader-title {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      line-height: 1;
    }

    .reader-summary {
      margin: 0;
      color: var(--soft);
      font-size: 17px;
      line-height: 1.8;
    }

    @media (max-width: 980px) {
      .hero-row {
        grid-template-columns: 1fr;
      }

      .quick-panel {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <div class="dream-orb orb-1"></div>
  <div class="dream-orb orb-2"></div>
  <div class="dream-orb orb-3"></div>
  <div class="floating-heart heart-1">♡</div>
  <div class="floating-heart heart-2">♡</div>
  <div class="floating-heart heart-3">♡</div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">Coco's World</a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="cocopress.html">CocoPress</a>
        <a href="#">CocoStream</a>
        <a href="story.html">Story</a>
        <a href="updates.html" class="active">Updates</a>
        <a href="gallery.html">Gallery</a>
        <a href="#">Calendar</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="updates-frame">
      <div class="hero-row">
        <div class="scrapbook-area">
          <h1 class="page-title">Updates</h1>
          <p class="page-subtitle">all the latest from Coco’s World</p>

          <div class="scrapbook-stage" id="scrapbookStage"></div>
        </div>

        <aside class="quick-panel">
          <h2>Updates</h2>
          <div class="quick-list" id="quickList"></div>
        </aside>
      </div>
    </section>
  </main>

  <div class="reader" id="reader">
    <div class="reader-card">
      <button class="reader-close" id="readerClose">×</button>
      <p class="reader-type" id="readerType"></p>
      <h2 class="reader-title" id="readerTitle"></h2>
      <p class="reader-summary" id="readerSummary"></p>
    </div>
  </div>

  <script>
    const scrapbookStage = document.getElementById("scrapbookStage");
    const quickList = document.getElementById("quickList");

    const reader = document.getElementById("reader");
    const readerClose = document.getElementById("readerClose");
    const readerType = document.getElementById("readerType");
    const readerTitle = document.getElementById("readerTitle");
    const readerSummary = document.getElementById("readerSummary");

    let updates = [];

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadUpdates() {
      const response = await fetch("./data/updates.json", { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Could not load ./data/updates.json");
      }

      updates = await response.json();
      renderUpdates();
    }

    function buildImage(item) {
      if (!item.image) {
        return `<div class="photo-placeholder"></div>`;
      }

      return `
        <div class="photo-placeholder">
          <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}">
        </div>
      `;
    }

    function renderUpdates() {
      const first = updates[0];
      const second = updates[1];
      const third = updates[2];

      scrapbookStage.innerHTML = `
        ${first ? `
          <article class="scrap main-polaroid" data-id="${escapeHtml(first.id)}">
            <div class="tape"></div>
            ${buildImage(first)}
            <div class="polaroid-caption">${escapeHtml(first.title)}</div>
          </article>
        ` : ""}

        ${second ? `
          <article class="scrap paper-note" data-id="${escapeHtml(second.id)}">
            <div class="tape"></div>
            <span class="note-kicker">${escapeHtml(second.type)}</span>
            <h3 class="note-title">${escapeHtml(second.title)}</h3>
            <p class="note-copy">${escapeHtml(second.summary)}</p>
          </article>
        ` : ""}

        ${third ? `
          <article class="scrap small-video" data-id="${escapeHtml(third.id)}">
            <span class="note-kicker">${escapeHtml(third.type)}</span>
            ${buildImage(third)}
            <p class="note-copy">${escapeHtml(third.summary)}</p>
          </article>
        ` : ""}

        <article class="scrap pink-note">
          <span class="note-kicker">Coco Says</span>
          <h3 class="note-title">“every stage is a new story.”</h3>
        </article>
      `;

      quickList.innerHTML = updates.map(item => `
        <button class="quick-item" type="button" data-id="${escapeHtml(item.id)}">
          <span class="quick-date">${escapeHtml(item.date)}</span>
          <span>
            <span class="quick-title">${escapeHtml(item.title)}</span>
            <span class="quick-summary">${escapeHtml(item.summary)}</span>
          </span>
        </button>
      `).join("");
    }

    function openUpdate(id) {
      const item = updates.find(update => update.id === id);
      if (!item) return;

      readerType.textContent = `${item.type || "Update"} · ${item.date || ""}`;
      readerTitle.textContent = item.title || "";
      readerSummary.textContent = item.summary || "";
      reader.classList.add("active");
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-id]");
      if (!target) return;
      openUpdate(target.dataset.id);
    });

    readerClose.addEventListener("click", () => {
      reader.classList.remove("active");
    });

    reader.addEventListener("click", event => {
      if (event.target === reader) {
        reader.classList.remove("active");
      }
    });

    loadUpdates().catch(error => {
      console.error(error);
      scrapbookStage.innerHTML = `<p class="note-copy">Updates could not load.</p>`;
    });
  </script>
</body>
</html>
