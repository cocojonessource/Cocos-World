<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f4ff;
    }

    .cards-section {
      width: 100%;
      padding: 60px 24px;
      position: relative;
    }

    .cards-heading {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 32px;
    }

    /* DESKTOP GRID */
    .cards-track {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      min-height: 220px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .card-number {
      font-size: 0.8rem;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 0 0 6px;
    }

    .card-text {
      font-size: 0.9rem;
      opacity: 0.8;
      margin: 0;
    }

    .carousel-btn {
      display: none;
    }

    /* TABLET */
    @media (max-width: 1024px) {
      .cards-track {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* MOBILE CAROUSEL */
    @media (max-width: 768px) {

      .cards-section {
        padding: 40px 0;
      }

      .cards-heading {
        padding: 0 16px;
      }

      .cards-track {
        display: flex;
        overflow-x: auto;
        gap: 16px;
        scroll-snap-type: x mandatory;
        padding: 0 16px 16px;
      }

      .cards-track::-webkit-scrollbar {
        display: none;
      }

      .card {
        flex: 0 0 85%;
        min-width: 85%;
        scroll-snap-align: center;
      }

      .carousel-btn {
        display: flex;
        position: absolute;
        top: 60%;
        transform: translateY(-50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: white;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        font-size: 20px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .prev {
        left: 5px;
      }

      .next {
        right: 5px;
      }
    }
  </style>
</head>

<body>

<section class="cards-section">
  <h2 class="cards-heading">My Cards</h2>

  <button class="carousel-btn prev">‹</button>

  <div class="cards-track" id="track">

    <div class="card">
      <div class="card-number">01</div>
      <div class="card-title">Card One</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">02</div>
      <div class="card-title">Card Two</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">03</div>
      <div class="card-title">Card Three</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">04</div>
      <div class="card-title">Card Four</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">05</div>
      <div class="card-title">Card Five</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">06</div>
      <div class="card-title">Card Six</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">07</div>
      <div class="card-title">Card Seven</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">08</div>
      <div class="card-title">Card Eight</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">09</div>
      <div class="card-title">Card Nine</div>
      <p class="card-text">Text</p>
    </div>

    <div class="card">
      <div class="card-number">10</div>
      <div class="card-title">Card Ten</div>
      <p class="card-text">Text</p>
    </div>

  </div>

  <button class="carousel-btn next">›</button>
</section>

<script>
  const track = document.getElementById("track");
  const prev = document.querySelector(".prev");
  const next = document.querySelector(".next");

  function scrollAmount() {
    return track.querySelector(".card").offsetWidth + 16;
  }

  prev.onclick = () => {
    track.scrollBy({ left: -scrollAmount(), behavior: "smooth" });
  };

  next.onclick = () => {
    track.scrollBy({ left: scrollAmount(), behavior: "smooth" });
  };
</script>

</body>
</html>
