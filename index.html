<!DOCTYPE html>
<html>
<head>
  <title>Coco’s World</title>
</head>

<body style="margin:0; font-family:sans-serif; background:#ffe4ec; color:#111;">

  <!-- NAV BAR -->
  <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#ffd1dc;
    font-weight:600;
  ">
    <div style="font-size:20px;">Coco’s World</div>

    <div style="display:flex; gap:20px;">
      <div>Home</div>
      <div>Gallery</div>
      <div>Music</div>
      <div>Shop</div>
      <div>World</div>
    </div>
  </div>

  <!-- HERO BANNER -->
  <div style="
    width:100%;
    height:450px;
    overflow:hidden;
  ">
    <img src="hero.jpg" style="
      width:100%;
      height:100%;
      object-fit:cover;
    ">
  </div>

  <!-- LATEST SECTION -->
  <div style="padding:30px;">
    <h2>Latest</h2>

    <div style="
      display:flex;
      gap:20px;
      overflow-x:auto;
    ">

      <div style="min-width:250px; height:140px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:250px; height:140px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:250px; height:140px; background:#fff0f5; border-radius:15px;"></div>

    </div>
  </div>

  <!-- MUSIC SECTION -->
  <div style="padding:30px;">
    <h2>Music</h2>

    <div style="
      display:flex;
      gap:20px;
      overflow-x:auto;
    ">

      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>

    </div>
  </div>

  <!-- GALLERY SECTION -->
  <div style="padding:30px;">
    <h2>Gallery</h2>

    <div style="
      display:flex;
      gap:20px;
      overflow-x:auto;
    ">

      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>
      <div style="min-width:180px; height:240px; background:#fff0f5; border-radius:15px;"></div>

    </div>
  </div>

</body>
</html>
