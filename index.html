<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coco's World</title>

  <style>
    :root {
      --bg: #FFE4EC;
      --nav: #FFD1DC;
      --primary: #6B2FA3;
      --secondary: #8B5FBF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--primary);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--nav);
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
    }

    .nav {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      font-family: Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
    }

    .main {
      min-height: calc(100vh - 76px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .about-box {
      max-width: 800px;
      text-align: center;
      background: rgba(255, 255, 255, 0.35);
      padding: 50px 35px;
      border-radius: 28px;
    }

    .about-box h1 {
      margin: 0 0 16px 0;
      font-size: 56px;
      line-height: 1;
    }

    .about-box p {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      color: var(--secondary);
    }

    @media (max-width: 768px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 20px;
      }

      .brand {
        font-size: 24px;
      }

      .about-box h1 {
        font-size: 40px;
      }

      .about-box p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Coco's World</div>

    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Gallery</a>
      <a href="#">Music</a>
      <a href="#">Shop</a>
      <a href="#">World</a>
    </nav>
  </header>

  <main class="main">
    <div class="about-box">
      <h1>Coco's World</h1>
      <p>
        A digital space for Coco Jones — music, visuals, moments, and more,
        all in one place.
      </p>
    </div>
  </main>
</body>
</html>
