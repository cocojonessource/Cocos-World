<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CocoStream | Coco's World</title>

<style>
:root {
  --primary:#6B2FA3;
  --secondary:#8B5FBF;
  --accent:#D76BA8;
  --gold:#D4A857;
  --white:#fff;
  --bg:#FFE4EC;
}

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to bottom,#fff8fb,var(--bg));
}

/* HERO */
.featured-hero{
  border-radius:30px;
  min-height:420px;
  display:flex;
  align-items:flex-end;
  padding:30px;
  margin-bottom:20px;
  background:
    linear-gradient(to right,rgba(45,17,73,.8),rgba(45,17,73,.3)),
    url('https://img.youtube.com/vi/0Lhs1WEjloo/maxresdefault.jpg');
  background-size:cover;
}

.featured-title{font-size:40px;color:#fff;}
.featured-copy{color:#eee;}

.hero-btn{
  padding:12px 18px;
  border:none;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}

/* PLAYER */
.player-frame iframe{
  width:100%;
  height:400px;
}

.playlist-item{
  cursor:pointer;
  padding:10px;
  border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="featured-hero" id="featuredHero">
  <div>
    <h2 class="featured-title" id="featuredTitle">Featured Video</h2>
    <p class="featured-copy" id="featuredCopy">Main highlight</p>
    <button class="hero-btn" id="heroPlayBtn">Play Now</button>
  </div>
</section>

<!-- PLAYER -->
<section class="stream-shell">

<article class="player-card">
  <div class="player-frame">
    <iframe
      id="mainPlayer"
      src="https://www.youtube.com/embed/0Lhs1WEjloo?rel=0"
      allowfullscreen>
    </iframe>
  </div>

  <h2 id="mainVideoTitle">Featured Video</h2>
  <p id="mainVideoDescription">Main video</p>
</article>

<!-- PLAYLIST -->
<div class="playlist">

<div class="playlist-item active"
  data-video-id="0Lhs1WEjloo"
  data-title="Featured Video"
  data-description="Main feature">
  ▶ Featured Video
</div>

<div class="playlist-item"
  data-video-id="ysz5S6PUM-U"
  data-title="Interview"
  data-description="Interview content">
  ▶ Interview
</div>

<div class="playlist-item"
  data-video-id="aqz-KE-bpKQ"
  data-title="Performance"
  data-description="Live performance">
  ▶ Performance
</div>

</div>

</section>

<script>

const mainPlayer=document.getElementById('mainPlayer');
const title=document.getElementById('mainVideoTitle');
const desc=document.getElementById('mainVideoDescription');

const hero=document.getElementById('featuredHero');
const heroTitle=document.getElementById('featuredTitle');
const heroCopy=document.getElementById('featuredCopy');

const items=document.querySelectorAll('.playlist-item');

function update(videoId,t,d){

mainPlayer.src=`https://www.youtube.com/embed/${videoId}?autoplay=1`;

title.textContent=t;
desc.textContent=d;

hero.style.backgroundImage=
`linear-gradient(to right,rgba(45,17,73,.8),rgba(45,17,73,.3)),
url('https://img.youtube.com/vi/${videoId}/maxresdefault.jpg')`;

heroTitle.textContent=t;
heroCopy.textContent=d;
}

items.forEach(item=>{
item.onclick=()=>{
update(
item.dataset.videoId,
item.dataset.title,
item.dataset.description
);
};
});

document.getElementById('heroPlayBtn').onclick=()=>{
document.querySelector('.player-frame').scrollIntoView({behavior:'smooth'});
};

</script>

</body>
</html>
